name: Build ActionRPG_UE5 IPA (Experimental)

on:
  workflow_dispatch:

env:
  UE_BRANCH: 5.3

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Check starting disk space
        run: df -h /

      - name: Checkout game project
        uses: actions/checkout@v4
        with:
          path: game

      - name: Verify game project
        run: |
          test -f "$GITHUB_WORKSPACE/game/ActionRPG.uproject"
          echo "Game project found"

      - name: Free safe-to-remove tools
        run: |
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/android-commandlinetools || true
          sudo rm -rf /Users/runner/.rustup /Users/runner/.cargo || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*.simruntime || true

          # ห้ามลบ Xcode เพราะต้องใช้ build iOS
          xcode-select -p
          xcodebuild -version
          df -h /

      - name: Clone Unreal Engine source
        env:
          ENGINE_CLONE_PAT: ${{ secrets.ENGINE_CLONE_PAT }}
        run: |
          test -n "$ENGINE_CLONE_PAT" || {
            echo "ENGINE_CLONE_PAT secret is missing"
            exit 1
          }

          git clone \
            --depth 1 \
            --branch "${{ env.UE_BRANCH }}" \
            "https://x-access-token:${ENGINE_CLONE_PAT}@github.com/EpicGames/UnrealEngine.git" \
            "$RUNNER_TEMP/UnrealEngine"

          test -d "$RUNNER_TEMP/UnrealEngine"
          echo "Unreal Engine cloned successfully"
          df -h /

      - name: Run Setup.sh
        run: |
          cd "$RUNNER_TEMP/UnrealEngine"

          ./Setup.sh \
            --exclude=Win64 \
            --exclude=Win32 \
            --exclude=Android \
            --exclude=Linux \
            --exclude=LinuxArm64 \
            --exclude=HTML5 \
            --exclude=PS4 \
            --exclude=PS5 \
            --exclude=XboxOne \
            --exclude=XSX \
            --exclude=Switch \
            --exclude=HoloLens \
            --exclude=Lumin

          df -h /

      - name: Generate project files
        run: |
          cd "$RUNNER_TEMP/UnrealEngine"
          ./GenerateProjectFiles.sh
          test -f UE5.xcodeproj/project.pbxproj

      - name: Build Unreal Editor
        run: |
          cd "$RUNNER_TEMP/UnrealEngine"

          xcodebuild \
            -project UE5.xcodeproj \
            -scheme UnrealEditor \
            -configuration Development \
            build

      - name: Package for iOS
        run: |
          test -f "$GITHUB_WORKSPACE/game/ActionRPG.uproject"
          test -f "$RUNNER_TEMP/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh"

          "$RUNNER_TEMP/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh" \
            BuildCookRun \
            -project="$GITHUB_WORKSPACE/game/ActionRPG.uproject" \
            -platform=IOS \
            -clientconfig=Development \
            -cook \
            -build \
            -stage \
            -package \
            -nosign \
            -archive \
            -archivedirectory="$RUNNER_TEMP/ipa_out"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionRPG-unsigned-ipa
          path: ${{ runner.temp }}/ipa_out/**/*.ipa

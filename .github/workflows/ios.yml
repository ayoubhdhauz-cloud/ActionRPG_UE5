name: Build ActionRPG UE4 IPA - v2

on:
  workflow_dispatch:

env:
  UE_BRANCH: 4.27
  GIT_TERMINAL_PROMPT: 0

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest # ← Xcode 14.x compatible กับ UE 4.27
    timeout-minutes: 360

    steps:
      - name: Workflow version
        run: |
          echo "WORKFLOW_VERSION=ios-ue4-v2-macos13"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          df -h /

      - name: Checkout game project
        uses: actions/checkout@v4
        with:
          path: game
          fetch-depth: 1

      - name: Verify game project
        shell: bash
        run: |
          set -e
          test -f "$GITHUB_WORKSPACE/game/ActionRPG.uproject"
          echo "Game project found:"
          ls -lh "$GITHUB_WORKSPACE/game/ActionRPG.uproject"

      - name: Check Xcode
        shell: bash
        run: |
          set -e
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Free disk space
        shell: bash
        run: |
          set -e

          echo "=== Disk before ==="
          df -h /

          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /usr/local/share/android-commandlinetools || true
          sudo rm -rf /usr/local/share/android-sdk || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/npm || true
          sudo rm -rf /Users/runner/.rustup || true
          sudo rm -rf /Users/runner/.cargo || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*.simruntime || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          echo "Xcode is intentionally kept"
          echo "=== Disk after ==="
          df -h /

      - name: Clone Unreal Engine
        shell: bash
        env:
          ENGINE_CLONE_PAT: ${{ secrets.ENGINE_CLONE_PAT }}
        run: |
          set -e

          if [ -z "$ENGINE_CLONE_PAT" ]; then
            echo "ERROR: ENGINE_CLONE_PAT secret is missing"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/UnrealEngine"

          git clone \
            --depth 1 \
            --branch "${{ env.UE_BRANCH }}" \
            "https://x-access-token:${ENGINE_CLONE_PAT}@github.com/EpicGames/UnrealEngine.git" \
            "$RUNNER_TEMP/UnrealEngine"

          echo "Unreal Engine cloned successfully"
          git -C "$RUNNER_TEMP/UnrealEngine" rev-parse --short HEAD
          df -h /

      - name: Setup Unreal Engine dependencies
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/UnrealEngine"

          chmod +x Setup.sh
          chmod +x GenerateProjectFiles.sh
          chmod +x Engine/Build/BatchFiles/RunUAT.sh
          chmod +x Engine/Build/BatchFiles/Mac/Build.sh

          ./Setup.sh \
            --exclude=Win64 \
            --exclude=Win32 \
            --exclude=Android \
            --exclude=Linux \
            --exclude=LinuxArm64 \
            --exclude=HTML5 \
            --exclude=PS4 \
            --exclude=PS5 \
            --exclude=XboxOne \
            --exclude=XSX \
            --exclude=Switch \
            --exclude=HoloLens \
            --exclude=Lumin

          df -h /

      - name: Bootstrap UnrealBuildTool
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/UnrealEngine"

          echo "Bootstrapping UnrealBuildTool..."

          status=0
          ./GenerateProjectFiles.sh || status=$?

          if [ "$status" -ne 0 ]; then
            if grep -Fq \
              "Unable to compute VC include paths on non-Windows host" \
              Engine/Programs/UnrealBuildTool/Log_GPF.txt; then
              echo "::warning::VisualStudioMac generation failed — expected, continuing."
            else
              echo "GenerateProjectFiles failed unexpectedly"
              cat Engine/Programs/UnrealBuildTool/Log_GPF.txt || true
              exit "$status"
            fi
          fi

          test -f "Engine/Binaries/DotNET/UnrealBuildTool.exe"
          echo "UnrealBuildTool is ready"
          ls -lh "Engine/Binaries/DotNET/UnrealBuildTool.exe"

      - name: Verify UnrealBuildTool
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/UnrealEngine"

          test -f "Engine/Binaries/DotNET/UnrealBuildTool.exe"
          test -f "Engine/Build/BatchFiles/Mac/Build.sh"
          test -f "Engine/Build/BatchFiles/RunUAT.sh"

          echo "Required Unreal build tools are ready"

      - name: Build Unreal Editor
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/UnrealEngine"

          ./Engine/Build/BatchFiles/Mac/Build.sh \
            UE4Editor \
            Mac \
            Development

          echo "Unreal Editor build completed"
          df -h /

      - name: Clean intermediates after build
        shell: bash
        run: |
          echo "=== Freeing space after editor build ==="
          rm -rf "$RUNNER_TEMP/UnrealEngine/Engine/Intermediate" || true
          rm -rf "$RUNNER_TEMP/UnrealEngine/Engine/Saved" || true
          rm -rf "$RUNNER_TEMP/UnrealEngine/Engine/DerivedDataCache" || true
          df -h /

      - name: Package game for iOS
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/UnrealEngine"

          PROJECT="$GITHUB_WORKSPACE/game/ActionRPG.uproject"
          UAT="$RUNNER_TEMP/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh"
          OUTPUT="$RUNNER_TEMP/ipa_out"

          test -f "$PROJECT"
          test -f "$UAT"

          mkdir -p "$OUTPUT"

          "$UAT" \
            BuildCookRun \
            -project="$PROJECT" \
            -noP4 \
            -utf8output \
            -unattended \
            -nopause \
            -platform=IOS \
            -clientconfig=Development \
            -cook \
            -build \
            -stage \
            -package \
            -nosign \
            -archive \
            -archivedirectory="$OUTPUT"

      - name: Inspect build output
        if: always()
        shell: bash
        run: |
          echo "Build output:"
          find "$RUNNER_TEMP/ipa_out" \
            -maxdepth 8 \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "Disk space:"
          df -h /

      - name: Verify IPA exists
        shell: bash
        run: |
          set -e

          IPA_COUNT=$(find "$RUNNER_TEMP/ipa_out" \
            -type f \
            -name "*.ipa" \
            | wc -l | tr -d ' ')

          echo "IPA files found: $IPA_COUNT"

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA file was generated"
            find "$RUNNER_TEMP/ipa_out" -maxdepth 8 -type f || true
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ActionRPG-unsigned-ipa
          path: ${{ runner.temp }}/ipa_out/**/*.ipa
          if-no-files-found: error

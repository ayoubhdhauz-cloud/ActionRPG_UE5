name: Build ActionRPG UE5 IPA

on:
  workflow_dispatch:

env:
  UE_BRANCH: 5.3

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Check starting disk space
        run: |
          df -h /

      - name: Checkout game project
        uses: actions/checkout@v4
        with:
          path: game

      - name: Verify game project
        run: |
          test -f "$GITHUB_WORKSPACE/game/ActionRPG.uproject"
          echo "Game project found:"
          echo "$GITHUB_WORKSPACE/game/ActionRPG.uproject"

      # อย่าลบ Xcode เพราะต้องใช้ xcodebuild สำหรับ iOS
      - name: Free safe-to-remove tools
        run: |
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/android-commandlinetools || true
          sudo rm -rf /Users/runner/.rustup || true
          sudo rm -rf /Users/runner/.cargo || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*.simruntime || true

          echo "Xcode is intentionally kept"
          xcode-select -p
          xcodebuild -version
          df -h /

      - name: Clone Unreal Engine source
        env:
          ENGINE_CLONE_PAT: ${{ secrets.ENGINE_CLONE_PAT }}
        run: |
          if [ -z "$ENGINE_CLONE_PAT" ]; then
            echo "ENGINE_CLONE_PAT secret is missing"
            exit 1
          fi

          git clone \
            --depth 1 \
            --branch "${{ env.UE_BRANCH }}" \
            "https://x-access-token:${ENGINE_CLONE_PAT}@github.com/EpicGames/UnrealEngine.git" \
            "$RUNNER_TEMP/UnrealEngine"

          test -d "$RUNNER_TEMP/UnrealEngine"

          echo "Unreal Engine cloned successfully"
          du -sh "$RUNNER_TEMP/UnrealEngine" || true
          df -h /

      - name: Setup Unreal Engine dependencies
        shell: bash
        run: |
          cd "$RUNNER_TEMP/UnrealEngine"

          ./Setup.sh \
            --exclude=Win64 \
            --exclude=Win32 \
            --exclude=Android \
            --exclude=Linux \
            --exclude=LinuxArm64 \
            --exclude=HTML5 \
            --exclude=PS4 \
            --exclude=PS5 \
            --exclude=XboxOne \
            --exclude=XSX \
            --exclude=Switch \
            --exclude=HoloLens \
            --exclude=Lumin

          df -h /

      - name: Generate Xcode project files
        shell: bash
        run: |
          cd "$RUNNER_TEMP/UnrealEngine"

          # Unreal 5.3 บน macOS อาจคืน exit code 1
          # ตอนสร้าง VisualStudioMac project ทั้งที่ Xcode project สร้างสำเร็จแล้ว
          status=0
          ./GenerateProjectFiles.sh || status=$?

          if [ "$status" -ne 0 ]; then
            if grep -Fq \
              "Unable to compute VC include paths on non-Windows host" \
              Engine/Programs/UnrealBuildTool/Log_GPF.txt; then

              echo "::warning::VisualStudioMac generation failed, but Xcode files were generated. Continuing."
            else
              echo "GenerateProjectFiles failed for an unexpected reason"
              cat Engine/Programs/UnrealBuildTool/Log_GPF.txt || true
              exit "$status"
            fi
          fi

          test -f "UE5.xcodeproj/project.pbxproj"
          test -d "UE5 (IOS).xcworkspace"

          echo "Xcode project files are ready"

      - name: Build Unreal Editor
        shell: bash
        run: |
          cd "$RUNNER_TEMP/UnrealEngine"

          xcodebuild \
            -project UE5.xcodeproj \
            -scheme UnrealEditor \
            -configuration Development \
            build

      - name: Package game for iOS
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/game/ActionRPG.uproject"
          test -f "$RUNNER_TEMP/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh"

          "$RUNNER_TEMP/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh" \
            BuildCookRun \
            -project="$GITHUB_WORKSPACE/game/ActionRPG.uproject" \
            -platform=IOS \
            -clientconfig=Development \
            -cook \
            -build \
            -stage \
            -package \
            -nosign \
            -archive \
            -archivedirectory="$RUNNER_TEMP/ipa_out"

      - name: Show package output
        if: always()
        run: |
          echo "Package files:"
          find "$RUNNER_TEMP/ipa_out" -maxdepth 5 -type f 2>/dev/null || true

          echo "Disk space:"
          df -h /

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionRPG-unsigned-ipa
          path: ${{ runner.temp }}/ipa_out/**/*.ipa
          if-no-files-found: error
